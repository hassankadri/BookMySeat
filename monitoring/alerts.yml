
groups:
  - name: bookmyseat-availability
    rules:
      - alert: BookMySeatBackendDown
        expr: up{job="bookmyseat-backend"} == 0
        for: 1m

        labels:
          severity: critical

        annotations:
          summary: "BookMySeat backend unavailable"
          description: "Prometheus cannot scrape the backend for over one minute."

      - alert: BookMySeatMongoDBDown
        expr: bookmyseat_mongodb_up == 0
        for: 2m

        labels:
          severity: critical

        annotations:
          summary: "MongoDB connection unavailable"
          description: "The BookMySeat backend has reported an unavailable MongoDB connection for over two minutes."

      - alert: BookMySeatRedisDown
        expr: bookmyseat_redis_up == 0
        for: 2m

        labels:
          severity: critical

        annotations:
          summary: "Redis connection unavailable"
          description: "BookMySeat has been unable to reach Redis for over two minutes."

  - name: bookmyseat-performance
    rules:
      - alert: BookMySeatHighHTTPErrorRate
        expr: |
          (
            sum(
              rate(
                bookmyseat_http_requests_total{
                  status_code=~"5.."
                }[5m]
              )
            )
            /
            clamp_min(
              sum(
                rate(
                  bookmyseat_http_requests_total[5m]
                )
              ),
              0.001
            )
          ) > 0.05
          and
          sum(
            increase(
              bookmyseat_http_requests_total[5m]
            )
          ) > 20
        for: 5m

        labels:
          severity: warning

        annotations:
          summary: "High HTTP error rate"
          description: "More than 5 percent of recent BookMySeat API requests are returning HTTP 5xx errors."

      - alert: BookMySeatHighLatency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(
                bookmyseat_http_request_duration_seconds_bucket{
                  route!="/api/metrics"
                }[5m]
              )
            )
          ) > 2
          and
          sum(
            increase(
              bookmyseat_http_request_duration_seconds_count{
                route!="/api/metrics"
              }[5m]
            )
          ) > 20
        for: 5m

        labels:
          severity: warning

        annotations:
          summary: "High API response latency"
          description: "The estimated 95th percentile API response time has exceeded two seconds."
