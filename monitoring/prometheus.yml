
global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: "bookmyseat-backend"
    metrics_path: /api/metrics

    static_configs:
      - targets:
          - "backend:5000"

        labels:
          application: "bookmyseat"
          component: "backend"
